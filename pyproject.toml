[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-xai"
version = "0.1.0"
description = "Explainable AI project for financial analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "xgboost>=2.0",
    "shap>=0.44",
    "jupyter>=1.0",
    "pytest>=7.0",
    "pyarrow>=15.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
